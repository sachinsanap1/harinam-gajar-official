{% extends "admin/base.html" %}
{% block title %}{{ 'Edit Reading' if text else 'New Reading' }}{% endblock %}
{% block admin_content %}
<h1>{{ 'Edit Reading Entry' if text else 'New Reading Entry' }}</h1>
<form method="POST" style="max-width:680px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-field"><label>Title</label><input type="text" name="title" value="{{ text.title if text else '' }}" required></div>
  <div class="form-field"><label>URL slug (optional — auto-generated)</label><input type="text" name="slug" value="{{ text.slug if text else '' }}"></div>
  <div class="form-field">
    <label>Category</label>
    <select name="category">
      {% for key, label in [('haripath','हरिपाठ'), ('aarti','आरती'), ('stotra','स्तोत्र'), ('namasmaran','नामस्मरण'), ('prayer','प्रार्थना'), ('other','इतर')] %}
      <option value="{{ key }}" {% if text and text.category == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-field"><label>Full Marathi text</label><textarea name="content_marathi" rows="14" required>{{ text.content_marathi if text else '' }}</textarea></div>
  <div class="form-field"><label>Source</label><input type="text" name="source" value="{{ text.source if text else '' }}"></div>
  <div class="form-field"><label>Audio URL (optional — leave blank if none)</label><input type="text" name="audio_url" value="{{ text.audio_url if text else '' }}"></div>
  <div class="form-field"><label>Sort order (lower shows first)</label><input type="number" name="order_index" value="{{ text.order_index if text else 0 }}"></div>
  <div class="form-field"><label><input type="checkbox" name="is_published" {% if not text or text.is_published %}checked{% endif %} style="width:auto;"> Published</label></div>
  <button class="btn btn-primary" type="submit">Save</button>
</form>
{% endblock %}
